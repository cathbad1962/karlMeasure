[package]
name = "karlMeasure"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
eframe = "0.36"
i_overlay = "8.1.0"
kurbo = { version = "0.13.1", features = ["serde"] }
pdfium-render = { version = "0.9", default-features = false, features = [
    "pdfium_latest",
    "thread_safe",
] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
